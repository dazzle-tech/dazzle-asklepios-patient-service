logging:
  level:
    ROOT: INFO
    com.dazzle.asklepios: DEBUG

management:
  prometheus:
    metrics:
      export:
        enabled: false
  zipkin: # Use the "zipkin" Maven profile to have the Spring Cloud Zipkin dependencies
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0 # report 100% of traces
service:
  asklepios-setup-service-url: http://asklepios-api-setup-service:8082
  asklepios-notification-service-url: http://asklepios-notification-service:8080
pacs:
