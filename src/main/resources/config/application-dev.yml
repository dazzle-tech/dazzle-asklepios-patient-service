logging:
  level:
    ROOT: DEBUG
    org.hibernate.SQL: DEBUG
    com.dazzle.asklepios: DEBUG
    org.springframework.cache: DEBUG

management:
  zipkin: # Use the "zipkin" Maven profile to have the Spring Cloud Zipkin dependencies
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0 # report 100% of traces
service:
  asklepios-setup-service-url: http://localhost:8082
  asklepios-notification-service-url: http://localhost:8085

waseel:
  api:
    base-url: https://api.stg-eclaims.waseel.com
    username: ${WASEEL_USERNAME:abh706}
    password: ${WASEEL_PASSWORD:abhclm706}
    provider-id: ${WASEEL_PROVIDER_ID:706}
    nphies-id: ${WASEEL_NPHIES_ID:10000000003170}
    system-type: ${WASEEL_SYSTEM_TYPE:1}
    timeout-seconds: 90
    # Enable in-memory Waseel pre-authorization mock (submit/search/cancel bypass real Waseel HTTP).
    mock-enabled: ${WASEEL_MOCK_ENABLED:true}
    # APPROVED | PARTIAL | REJECTED | ROTATE (cycles approved -> partial -> rejected per submit)
    mock-scenario: ${WASEEL_MOCK_SCENARIO:APPROVED}

application:
  asklepios-application-url: http://localhost:3100//#
pacs:
  base-url: https://him.onehealth.com.sa/api/method/casting.casting.dicom_share.get_dicom_studies_by_accession_number
  token: YmNhYTQ4ZTVjODQ5MWZiOjQ2MzU1ODU5MTM0NDcyMw==
  expires-in-hours: 48

spring:
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  jackson:
    serialization:
      indent-output: true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://localhost:5433/test
    username: postgres
    password: root

    hikari:
      poolName: Hikari
      auto-commit: false
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false


server:
  port: 8083
  # make sure requests the proxy uri instead of the server one
  forward-headers-strategy: framework
patient:
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 and be at least 256 bits long (you can type `openssl rand -base64 64` on your command line to generate a 512 bits one)
        base64-secret: Y2RiNDRmMGM3ODZkM2FhMTEwYWYxZGE0NjQ3ODM5YThkYWFjZWYzMzY2ZDVkMTVhNGEyNDNmZTM0MzQ5NTRhMmVlMmFkNGVlODBmYTkyZWE4ZWYyMDRhZDJiZGU4YzJhMGEyN2U5NGUzMmNmNWU4Yzk2MDVkNzhmY2M3YTgyZDM=
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
    level:
      com.dazzle.asklepios.integration.waseel: DEBUG
      feign: DEBUG

  attachments:
    bucket: asklepios
    region: sfo3
    endpoint: https://sfo3.digitaloceanspaces.com
    accessKeyId: DO00TRNC7U4TLLL6ZAN2
    secretAccessKey: mNFZKBA/BPXTHVUsde8y/2MslOn7zZEiPzwfIuhLrx4
    presignExpirySeconds: 300
    maxBytes: 52428800
    allowed: application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,image/jpeg,image/png,text/plain
  appointment:
    auto-no-show:
      job-zone: Asia/Hebron
      system-job-user: SYSTEM_JOB
      no-show-reason: Not Specified
    template-interval-ended:
      cron: "0 0 7 * * *"
      zone: "Asia/Gaza"
      springdoc:
      pre-loading-enabled: true